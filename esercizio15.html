<!DOCTYPE html>
<html>
<body>

    <h3>Calcolo Banconote</h3>
    
    <input type="number" id="inputSomma" placeholder="Inserisci cifra">
    <button onclick="esegui()">Calcola</button>

    <p id="output"></p>

    <script>
        function esegui() {
            // Prendo il numero scritto dall'utente
            let somma = document.getElementById("inputSomma").value;

            // Faccio i calcoli (proprio come nel tuo schema)
            let b50 = Math.floor(somma / 50);
            let resto50 = somma % 50;

            let b20 = Math.floor(resto50 / 20);
            let resto20 = resto50 % 20;

            let b10 = Math.floor(resto20 / 10);

            // Scrivo il risultato nella pagina
            document.getElementById("output").innerText = 
                "Somma: " + somma + 
                "\n 50€: " + b50 + 
                "\n 20€: " + b20 + 
                "\n 10€: " + b10;
        }
    </script>

</body>
</html>
