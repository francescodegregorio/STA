<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 8</title>

  
        <style>
                body{
                    font-family: Arial, Helvetica, sans-serif;
                    background-color:#88A7F2;  
                    text-align: center;
                    padding:20px;

                }

                h1{
                    margin-bottom:20px ;


                }
                .container{
                    background: white;
                    color:black;
                    padding: 20px;
                    border-radius: 5px;
                }
                input{
                     width: 30%;
                     padding: 8px;
                     border-radius: 5px;
                     border: 1px solid #ccc;
                }
                .button {
  background-color: #04AA6D;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  transition-duration: 0.4s;
}

.button2:hover {box-shadow: 0 8px 16px 0 rgba(0,0,0,0.6);}
        </style>


</head>
<body>

    <h2>Generatore di Numeri Casuali</h2>

    <p id="risultato">Numero: </p>

    <button onclick="generaNumero()">1) Genera numero casuale</button>
    <button onclick="arrotondaNumero()">2) Math.floor(numero)</button>
    <button onclick="genera1a90()">3) Numero casuale tra 1 e 90</button>

    <script>

        let numeroCasuale;

        function generaNumero() {
            numeroCasuale = Math.random();
            document.getElementById("risultato").innerHTML =
                "Numero casuale tra 0 e 1: " + numeroCasuale;
        }

        function arrotondaNumero() {
            if (numeroCasuale !== undefined) {
                let numeroIntero = Math.floor(numeroCasuale);
                document.getElementById("risultato").innerHTML =
                    "Math.floor(numeroCasuale): " + numeroIntero;
            } else {
                alert("Prima genera il numero casuale!");
            }
        }

        function genera1a90() {
            let numero1a90 = Math.floor(Math.random() * 90) + 1;
            document.getElementById("risultato").innerHTML =
                "Numero casuale tra 1 e 90: " + numero1a90;
        }

    </script>

</body>
</html>
